<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <div class="logo">TravelGo</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">Home</a></li>
                <li><a href="#destinations">Destinations</a></li>
                <li><a href="#packages">Packages</a></li>
                <li><a href="#booking">Book Now</a></li>
            </ul>
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Explore the World</h1>
            <p>Your adventure starts with us. Book your dream vacation today!</p>
            <a href="#packages" class="btn">View Packages</a>
        </div>
    </section>

    <!-- DESTINATIONS -->
    <section id="destinations" class="section">
        <h2>Popular Destinations</h2>
        <div class="grid">
            <div class="card"><img src="https://picsum.photos/300?random=1"><h3>Paris</h3></div>
            <div class="card"><img src="https://picsum.photos/300?random=2"><h3>Dubai</h3></div>
            <div class="card"><img src="https://picsum.photos/300?random=3"><h3>Maldives</h3></div>
        </div>
    </section>

    <!-- PACKAGES -->
    <section id="packages" class="section">
        <h2>Travel Packages</h2>

        <div id="packageList" class="packages"></div>
    </section>

    <!-- BOOKING FORM -->
    <section id="booking" class="section">
        <h2>Book Your Trip</h2>

        <form class="booking-form">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <select required>
                <option value="">Select Destination</option>
                <option>Paris</option>
                <option>Dubai</option>
                <option>Maldives</option>
            </select>
            <input type="date" required>
            <button type="submit">Submit Booking</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 TravelGo. All rights reserved.</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
